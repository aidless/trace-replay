[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-replay"
version = "0.1.0"
description = "离线、确定性、fail-closed 的 agent 轨迹重放评测器（仅用 Python 标准库）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trace-replay contributors" }]
keywords = ["llm", "evaluation", "replay", "determinism", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8"]

[project.scripts]
trace-replay = "trace_replay.cli:main"

[tool.setuptools]
packages = ["trace_replay"]

[tool.setuptools.package-data]
trace_replay = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["trace_replay"]
